# Pousser un tag (ex. git tag v0.1.1 && git push origin v0.1.1) construit l'installateur, publie la release GitHub
# puis propose la nouvelle version à winget (si le secret WINGET_TOKEN existe).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run dist
      # latest.yml et le blockmap servent aux mises à jour automatiques.
      - run: gh release create "${{ github.ref_name }}" release/*.exe release/*.blockmap release/latest.yml --generate-notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  winget:
    needs: windows
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      # Ouvre une pull request sur microsoft/winget-pkgs depuis le fork de Coolbreeze88.
      - if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: Coolbreeze88.Electrik
          release-tag: ${{ github.ref_name }}
          installers-regex: '\.exe$'
          token: ${{ env.WINGET_TOKEN }}
